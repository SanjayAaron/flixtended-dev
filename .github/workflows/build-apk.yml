name: Build APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FlixQuest-India
        uses: actions/checkout@v4
        with:
          path: FlixQuest-India

      - name: Checkout betterplayer
        uses: actions/checkout@v4
        with:
          repository: BeamlakAschalew/flixquest-betterplayer
          path: flixquest-betterplayer

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: 'stable'

      - name: Create .env file
        working-directory: FlixQuest-India
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            echo "TMDB_API_KEY=dummy" > .env
            echo "MIXPANEL_API_KEY=dummy" >> .env
            echo "FLIXQUEST_API_URL=https://dummy.example.com" >> .env
          fi
          
          if [ -n "${{ secrets.TMDB_API_KEY }}" ]; then
            sed -i "s|^TMDB_API_KEY=.*|TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}|" .env
          fi
          if [ -n "${{ secrets.MIXPANEL_API_KEY }}" ]; then
            sed -i "s|^MIXPANEL_API_KEY=.*|MIXPANEL_API_KEY=${{ secrets.MIXPANEL_API_KEY }}|" .env
          fi
          if [ -n "${{ secrets.FLIXQUEST_API_URL }}" ]; then
            sed -i "s|^FLIXQUEST_API_URL=.*|FLIXQUEST_API_URL=${{ secrets.FLIXQUEST_API_URL }}|" .env
          fi

      - name: Setup Firebase Google Services
        working-directory: FlixQuest-India
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "Decoding Google Services JSON from secrets..."
            if echo "$GOOGLE_SERVICES_JSON" | base64 -d | jq e . >/dev/null 2>&1; then
               echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
            else
               echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            fi
            
            if ! jq e . android/app/google-services.json >/dev/null 2>&1; then
              echo "Error: GOOGLE_SERVICES_JSON is not valid JSON."
              exit 1
            fi
            echo "Successfully configured Google Services."
          else
            echo "GOOGLE_SERVICES_JSON secret not provided. Skipping Google Services setup. The app will use dummy runtime config."
          fi

      - name: Install dependencies
        working-directory: FlixQuest-India
        run: flutter pub get

      - name: Build APK
        working-directory: FlixQuest-India
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: FlixQuest-India/build/app/outputs/flutter-apk/app-release.apk
