name: Build APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FlixQuest-India
        uses: actions/checkout@v4
        with:
          path: FlixQuest-India

      - name: Checkout betterplayer
        uses: actions/checkout@v4
        with:
          repository: BeamlakAschalew/flixquest-betterplayer
          path: flixquest-betterplayer

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: 'stable'
          
      - name: Install dependencies
        working-directory: FlixQuest-India
        run: flutter pub get

      - name: Build APK
        working-directory: FlixQuest-India
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: FlixQuest-India/build/app/outputs/flutter-apk/app-release.apk
